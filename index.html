<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>chromget — Chrome Binary Browser</title>
  <meta name="description" content="Browse and download Chrome for Testing binaries across all platforms and versions. Filter by OS, architecture and version number." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #151820;
      --surface2:  #1c2030;
      --border:    #262c3e;
      --accent:    #4f8ef7;
      --accent2:   #7c5cfc;
      --green:     #3ecf8e;
      --red:       #f76e6e;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    10px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── HEADER ────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #0d0f14 0%, #111728 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 32px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .logo-text { line-height: 1.1; }
    .logo-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }
    .header-stats {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .stat-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill strong { color: var(--text); font-weight: 600; }

    /* ─── MAIN ──────────────────────────────────────────── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
    }

    /* ─── FILTERS ───────────────────────────────────────── */
    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 160px;
    }
    .filter-group.grow { flex: 1; min-width: 200px; }
    .filter-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }
    .filter-input,
    .filter-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }
    .filter-input:focus,
    .filter-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,.15);
    }
    .filter-select option { background: var(--surface2); }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 9px 18px;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-reset:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ─── RESULT COUNT ──────────────────────────────────── */
    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .result-count {
      font-size: 13px;
      color: var(--muted);
    }
    .result-count strong { color: var(--text); }
    .page-info { font-size: 13px; color: var(--muted); }

    /* ─── TABLE ─────────────────────────────────────────── */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface); }
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color .15s;
    }
    th:hover { color: var(--text); }
    th .sort-arrow { margin-left: 4px; opacity: .4; font-style: normal; }
    th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td {
      padding: 12px 16px;
      font-size: 13px;
      vertical-align: middle;
    }
    .td-version {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--accent);
      font-weight: 500;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-os-win  { background: rgba(79,142,247,.12); color: #6ca6ff; border: 1px solid rgba(79,142,247,.2); }
    .badge-os-mac  { background: rgba(156,132,247,.12); color: #b09cff; border: 1px solid rgba(156,132,247,.2); }
    .badge-os-linux { background: rgba(62,207,142,.12); color: #52d9a0; border: 1px solid rgba(62,207,142,.2); }
    .badge-arch {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge-status-online  { background: rgba(62,207,142,.1); color: var(--green); border: 1px solid rgba(62,207,142,.2); }
    .badge-status-offline { background: rgba(247,110,110,.1); color: var(--red);  border: 1px solid rgba(247,110,110,.2); }
    .badge-status-unknown { background: rgba(100,116,139,.1); color: var(--muted); border: 1px solid rgba(100,116,139,.2); }
    .size-text { color: var(--muted); font-size: 12px; }
    .btn-dl {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 7px;
      color: #fff;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      text-decoration: none;
      transition: opacity .2s, transform .15s;
      white-space: nowrap;
    }
    .btn-dl:hover { opacity: .85; transform: translateY(-1px); }

    /* ─── PAGINATION ────────────────────────────────────── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .page-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 7px 13px;
      transition: all .2s;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .page-btn:disabled { opacity: .35; cursor: default; }

    /* ─── LOADER ────────────────────────────────────────── */
    #loader {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── EMPTY ─────────────────────────────────────────── */
    #empty {
      display: none;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    #empty .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* ─── RESPONSIVE ────────────────────────────────────── */
    @media (max-width: 768px) {
      main { padding: 16px; }
      .filters { padding: 16px; gap: 12px; }
      .filter-group { min-width: 100%; }
      td, th { padding: 10px 12px; }
      .td-version { font-size: 11.5px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">⬡</div>
      <div class="logo-text">
        <div class="logo-name">chromget</div>
        <div class="logo-sub">Chrome for Testing — Binary Browser</div>
      </div>
    </a>
    <div class="header-stats">
      <div class="stat-pill">📦 <strong id="stat-versions">—</strong> versions</div>
      <div class="stat-pill">🗂 <strong id="stat-entries">—</strong> binaries</div>
      <a class="stat-pill" href="https://github.com/jmsalazardev/chromget" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;">
        ★ GitHub
      </a>
    </div>
  </div>
</header>

<main>
  <!-- Filters -->
  <div class="filters">
    <div class="filter-group grow">
      <label class="filter-label" for="search">Search version</label>
      <input id="search" class="filter-input" type="search" placeholder="e.g. 120, 115.0.5790…" autocomplete="off" />
    </div>
    <div class="filter-group">
      <label class="filter-label" for="filter-os">Operating System</label>
      <select id="filter-os" class="filter-select">
        <option value="">All OS</option>
        <option value="win">Windows</option>
        <option value="mac">macOS</option>
        <option value="linux">Linux</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="filter-arch">Architecture</label>
      <select id="filter-arch" class="filter-select">
        <option value="">All Arch</option>
        <option value="x86">x86 (32-bit)</option>
        <option value="x64">x64 (64-bit)</option>
        <option value="arm64">ARM64</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="filter-status">Status</label>
      <select id="filter-status" class="filter-select">
        <option value="">All</option>
        <option value="online">Online</option>
        <option value="offline">Offline</option>
      </select>
    </div>
    <button class="btn-reset" id="btn-reset">✕ Reset</button>
  </div>

  <!-- Result bar -->
  <div class="result-bar">
    <div class="result-count" id="result-count"></div>
    <div class="page-info" id="page-info"></div>
  </div>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <div>Loading Chrome release data…</div>
  </div>

  <!-- Empty -->
  <div id="empty">
    <div class="empty-icon">🔍</div>
    <div>No results match your filters.</div>
  </div>

  <!-- Table -->
  <div id="table-container" style="display:none">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th id="th-version" data-col="version">Version <em class="sort-arrow">↕</em></th>
            <th>OS</th>
            <th>Arch</th>
            <th id="th-size" data-col="size">Size <em class="sort-arrow">↕</em></th>
            <th>Status</th>
            <th>Download</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const DATA_URL = 'https://raw.githubusercontent.com/jmsalazardev/chromget/main/src/resources/chrome.json';
const PAGE_SIZE = 50;

// ── State ─────────────────────────────────────────────────────────────────────
let allRows = [];      // { version, platform, os, arch, url, status, size, checkedAt }
let filtered = [];
let sortCol = 'version';
let sortDir = -1;      // -1 = desc (newest first)
let page = 1;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const $loader    = document.getElementById('loader');
const $empty     = document.getElementById('empty');
const $container = document.getElementById('table-container');
const $tbody     = document.getElementById('tbody');
const $pagination= document.getElementById('pagination');
const $search    = document.getElementById('search');
const $os        = document.getElementById('filter-os');
const $arch      = document.getElementById('filter-arch');
const $status    = document.getElementById('filter-status');
const $reset     = document.getElementById('btn-reset');
const $count     = document.getElementById('result-count');
const $pageInfo  = document.getElementById('page-info');
const $statVer   = document.getElementById('stat-versions');
const $statEnt   = document.getElementById('stat-entries');

// ── Helpers ───────────────────────────────────────────────────────────────────
function parseOs(platform) {
  if (platform.startsWith('win'))   return 'win';
  if (platform.startsWith('mac'))   return 'mac';
  if (platform.startsWith('linux')) return 'linux';
  return 'unknown';
}
function parseArch(platform) {
  if (platform.includes('arm64')) return 'arm64';
  if (platform.includes('x64'))   return 'x64';
  if (platform.includes('x86'))   return 'x86';
  return platform;
}
function osLabel(os) {
  return { win: 'Windows', mac: 'macOS', linux: 'Linux' }[os] ?? os;
}
function osBadgeClass(os) {
  return { win: 'badge-os-win', mac: 'badge-os-mac', linux: 'badge-os-linux' }[os] ?? '';
}
function osEmoji(os) {
  return { win: '🪟', mac: '🍎', linux: '🐧' }[os] ?? '';
}
function formatBytes(bytes) {
  if (!bytes) return '—';
  const mb = bytes / (1024 * 1024);
  return mb >= 1000
    ? (mb / 1024).toFixed(2) + ' GB'
    : mb.toFixed(1) + ' MB';
}
function versionSort(a, b) {
  const pa = a.split('.').map(Number);
  const pb = b.split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] ?? 0) - (pb[i] ?? 0);
    if (d !== 0) return d;
  }
  return 0;
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    const rows = [];
    for (const [version, platforms] of Object.entries(json)) {
      for (const [platform, info] of Object.entries(platforms)) {
        rows.push({
          version,
          platform,
          os:   parseOs(platform),
          arch: parseArch(platform),
          url:  info.url,
          status: info.status ?? 'unknown',
          size:   info.size ?? 0,
          checkedAt: info.checkedAt ?? '',
        });
      }
    }

    allRows = rows;
    const versions = new Set(rows.map(r => r.version));
    $statVer.textContent = versions.size.toLocaleString();
    $statEnt.textContent = rows.length.toLocaleString();

    $loader.style.display = 'none';
    applyFilters();
  } catch (err) {
    $loader.innerHTML = `<div style="color:var(--red)">⚠️ Failed to load data.<br><small>${err.message}</small></div>`;
  }
}

// ── Filter + sort ─────────────────────────────────────────────────────────────
function applyFilters() {
  const search  = $search.value.trim().toLowerCase();
  const os      = $os.value;
  const arch    = $arch.value;
  const status  = $status.value;

  filtered = allRows.filter(r => {
    if (search  && !r.version.startsWith(search)) return false;
    if (os      && r.os !== os)                   return false;
    if (arch    && r.arch !== arch)               return false;
    if (status  && r.status !== status)           return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (sortCol === 'version') return sortDir * versionSort(a.version, b.version);
    if (sortCol === 'size')    return sortDir * (a.size - b.size);
    return 0;
  });

  page = 1;
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  page = Math.min(page, totalPages);

  const start = (page - 1) * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);

  // counts
  $count.innerHTML = `Showing <strong>${slice.length}</strong> of <strong>${total.toLocaleString()}</strong> results`;
  $pageInfo.textContent = `Page ${page} of ${totalPages}`;

  if (total === 0) {
    $container.style.display = 'none';
    $empty.style.display = 'block';
    return;
  }
  $empty.style.display = 'none';
  $container.style.display = 'block';

  // rows
  $tbody.innerHTML = slice.map(r => `
    <tr>
      <td class="td-version">${escHtml(r.version)}</td>
      <td>
        <span class="badge ${osBadgeClass(r.os)}">
          ${osEmoji(r.os)} ${osLabel(r.os)}
        </span>
      </td>
      <td><span class="badge badge-arch">${escHtml(r.arch)}</span></td>
      <td class="size-text">${formatBytes(r.size)}</td>
      <td>
        <span class="badge badge-status-${r.status}">
          ${r.status === 'online' ? '●' : r.status === 'offline' ? '○' : '?'} ${r.status}
        </span>
      </td>
      <td>
        <a class="btn-dl" href="${escHtml(r.url)}" target="_blank" rel="noopener" download>
          ↓ Download
        </a>
      </td>
    </tr>
  `).join('');

  // sort arrows
  document.querySelectorAll('th[data-col]').forEach(th => {
    const arrow = th.querySelector('.sort-arrow');
    if (th.dataset.col === sortCol) {
      th.classList.add('sorted');
      arrow.textContent = sortDir === 1 ? '↑' : '↓';
    } else {
      th.classList.remove('sorted');
      arrow.textContent = '↕';
    }
  });

  // pagination
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  if (totalPages <= 1) { $pagination.innerHTML = ''; return; }

  const range = [];
  const delta = 2;
  const left  = page - delta;
  const right = page + delta;

  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= left && i <= right)) {
      range.push(i);
    }
  }

  const buttons = [];
  buttons.push(`<button class="page-btn" ${page===1?'disabled':''} onclick="goPage(${page-1})">‹ Prev</button>`);

  let prev = null;
  for (const p of range) {
    if (prev !== null && p - prev > 1) {
      buttons.push(`<button class="page-btn" disabled>…</button>`);
    }
    buttons.push(`<button class="page-btn ${p === page ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`);
    prev = p;
  }

  buttons.push(`<button class="page-btn" ${page===totalPages?'disabled':''} onclick="goPage(${page+1})">Next ›</button>`);
  $pagination.innerHTML = buttons.join('');
}

function goPage(p) {
  page = p;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Escape HTML ───────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Events ────────────────────────────────────────────────────────────────────
let debounceTimer;
$search.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilters, 200);
});
$os.addEventListener('change', applyFilters);
$arch.addEventListener('change', applyFilters);
$status.addEventListener('change', applyFilters);
$reset.addEventListener('click', () => {
  $search.value = '';
  $os.value = '';
  $arch.value = '';
  $status.value = '';
  applyFilters();
});

// sort headers
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (sortCol === th.dataset.col) {
      sortDir *= -1;
    } else {
      sortCol = th.dataset.col;
      sortDir = -1;
    }
    applyFilters();
  });
});

// ── Boot ──────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
